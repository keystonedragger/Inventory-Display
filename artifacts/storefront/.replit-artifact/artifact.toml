kind = "mobile"
previewPath = "/"
title = "Storefront"
version = "1.0.0"
id = "artifacts/storefront"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23230

[services.development]
run = "pnpm --filter @workspace/storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/storefront", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/storefront", "run", "serve" ]

[services.env]
PORT = "23230"
BASE_PATH = "/"
